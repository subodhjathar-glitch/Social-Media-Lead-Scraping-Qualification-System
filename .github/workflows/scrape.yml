name: Scrape and Qualify Leads

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'    # 6 AM UTC (11:30 AM IST)
    - cron: '0 18 * * *'   # 6 PM UTC (11:30 PM IST)

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify environment variables
        run: |
          echo "Checking required environment variables..."
          echo "YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:+SET}"
          echo "OPENAI_API_KEY: ${OPENAI_API_KEY:+SET}"
          echo "SUPABASE_URL: ${SUPABASE_URL:+SET}"
          echo "SUPABASE_KEY: ${SUPABASE_KEY:+SET}"
          echo "SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:+SET}"
          echo "EMAIL_FROM: ${EMAIL_FROM:+SET}"
          echo "EMAIL_TO: ${EMAIL_TO:+SET}"
          echo "EMAIL_PASSWORD: ${EMAIL_PASSWORD:+SET}"
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: Run lead scraper
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python -m src.main

      - name: Upload logs and offline data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-twice-daily
          path: |
            logs/
            data/
          retention-days: 30
